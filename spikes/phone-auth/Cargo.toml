[package]
name = "omarchy-phone-auth-spike"
version = "0.0.1"
edition = "2021"
publish = false
license = "MIT"
description = "Spike: authenticate on Omarchy with a phone passkey over the FIDO hybrid (caBLE) transport"

[[bin]]
name = "omarchy-phone-auth-spike"
path = "src/main.rs"

[dependencies]
# Pinned to a reviewed commit; the hybrid API moves between releases.
libwebauthn = { git = "https://github.com/linux-credentials/libwebauthn", rev = "e5f01db" }
tokio = { version = "1.45", features = ["full"] }
async-trait = "0.1"
qrcode = { version = "0.14.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
rand = "0.8"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
